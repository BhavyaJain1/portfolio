<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Cyan to Emerald Target Gradient -->
    <linearGradient id="c3CrosshairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <style>
      .radar-spin {
        transform-origin: 60px 60px;
        animation: radarSweep 4s linear infinite;
      }
      .reticle-tick {
        stroke-dasharray: 30;
        stroke-dashoffset: 30;
        animation: checkScan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes checkScan {
        0%, 20% { stroke-dashoffset: 30; opacity: 0; }
        50%, 85% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Circular Reticle Target Frame -->
  <circle cx="60" cy="60" r="48" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" fill="none" />
  <circle cx="60" cy="60" r="40" stroke="#334155" stroke-width="1.5" fill="none" />

  <!-- Subtle Rotating Radar Scan Sweep -->
  <line x1="60" y1="60" x2="60" y2="12" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" class="radar-spin" />

  <!-- 4 Precision Crosshair Reticle Markers -->
  <line x1="60" y1="6" x2="60" y2="18" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <line x1="60" y1="102" x2="60" y2="114" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <line x1="6" y1="60" x2="18" y2="60" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <line x1="102" y1="60" x2="114" y2="60" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />

  <!-- Robotic Bug Antennae -->
  <path d="M 54 38 L 42 24" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="42" cy="24" r="2.5" fill="#06b6d4" />
  <path d="M 66 38 L 78 24" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="78" cy="24" r="2.5" fill="#06b6d4" />

  <!-- Bug Head -->
  <path d="M 50 40 Q 60 34 70 40 L 68 46 L 52 46 Z" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />

  <!-- Bug Robotic Circuit Legs -->
  <path d="M 46 54 L 30 48" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 74 54 L 90 48" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 44 64 L 26 64" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 76 64 L 94 64" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 46 74 L 30 80" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 74 74 L 90 80" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bug Core Body -->
  <path
    d="M 46 48 C 46 44, 74 44, 74 48 L 76 74 C 76 84, 60 90, 60 90 C 60 90, 44 84, 44 74 Z"
    fill="#0a0f1d"
    stroke="url(#c3CrosshairGrad)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Central Scan Reticle / Green Assertion Check -->
  <path d="M 52 64 L 58 70 L 70 56" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" class="reticle-tick" />
  <circle cx="70" cy="56" r="2.5" fill="#34d399" />
</svg>
