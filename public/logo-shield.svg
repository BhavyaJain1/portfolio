<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Cyber Theme Gradient -->
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Dark Glass Shield Backdrop -->
    <linearGradient id="shieldGlassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98" />
    </linearGradient>

    <!-- Soft Luminous Glow -->
    <filter id="bugShieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* ============================================================
         CRAWL — alternating tripod gait.
         Tripod A: front-left + middle-right + hind-left
         Tripod B: front-right + middle-left + hind-right
         The two tripods are exactly out of phase, which is what
         reads as "walking" rather than "legs wiggling".
         ============================================================ */
      @keyframes tripodA {
        0%, 100% { transform: rotate(-7deg); }
        50%      { transform: rotate(7deg); }
      }
      @keyframes tripodB {
        0%, 100% { transform: rotate(7deg); }
        50%      { transform: rotate(-7deg); }
      }

      /* Body bobs twice per gait cycle — once per tripod plant. */
      @keyframes bodyBob {
        0%, 50%, 100% { transform: translateY(0.5px); }
        25%, 75%      { transform: translateY(-0.5px); }
      }

      /* Antennae sweep on their own longer, offset cycles so they
         feel like they're sensing rather than keeping time. */
      @keyframes antennaSweepL {
        0%, 100% { transform: rotate(0deg); }
        35%      { transform: rotate(-8deg); }
        70%      { transform: rotate(5deg); }
      }
      @keyframes antennaSweepR {
        0%, 100% { transform: rotate(0deg); }
        30%      { transform: rotate(7deg); }
        65%      { transform: rotate(-6deg); }
      }

      @keyframes passPulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50%      { opacity: 1; filter: drop-shadow(0 0 6px #10b981); transform: scale(1.05); }
      }

      .bug-body {
        animation: bodyBob 0.9s ease-in-out infinite;
      }

      .leg {
        animation-duration: 0.9s;
        animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1);
        animation-iteration-count: infinite;
      }
      .leg-fl { transform-origin: 46px 51px; animation-name: tripodA; }
      .leg-mr { transform-origin: 77px 62px; animation-name: tripodA; }
      .leg-hl { transform-origin: 46px 73px; animation-name: tripodA; }

      .leg-fr { transform-origin: 74px 51px; animation-name: tripodB; }
      .leg-ml { transform-origin: 43px 62px; animation-name: tripodB; }
      .leg-hr { transform-origin: 74px 73px; animation-name: tripodB; }

      .antenna-l {
        transform-origin: 54px 39px;
        animation: antennaSweepL 1.7s ease-in-out infinite;
      }
      .antenna-r {
        transform-origin: 66px 39px;
        animation: antennaSweepR 2.1s ease-in-out infinite;
      }

      .pass-node {
        animation: passPulse 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Hold everything still for anyone who asked the OS not to animate. */
      @media (prefers-reduced-motion: reduce) {
        .bug-body, .leg, .antenna-l, .antenna-r, .pass-node {
          animation: none;
        }
      }
    </style>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <path
    d="M 60 14 Q 96 14 96 34 C 96 74 60 106 60 106 C 60 106 24 74 24 34 Q 24 14 60 14 Z"
    fill="#06b6d4"
    opacity="0.1"
    filter="url(#bugShieldGlow)"
  />

  <!-- 1. The Outer Security Shield (static frame) -->
  <path
    d="M 60 14 Q 96 14 96 34 C 96 74 60 106 60 106 C 60 106 24 74 24 34 Q 24 14 60 14 Z"
    fill="url(#shieldGlassFill)"
    stroke="url(#shieldBorderGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- ===== The crawling bug ===== -->
  <g class="bug-body">

    <!-- 2. Bug Antennae (sweeping sensors) -->
    <path class="antenna-l" d="M 54 39 Q 48 27 42 29" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" fill="none" />
    <path class="antenna-r" d="M 66 39 Q 72 27 78 29" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- 3. Bug Head (Segmented crown) -->
    <path
      d="M 52 42 C 52 36, 68 36, 68 42 Z"
      fill="#1e293b"
      stroke="#06b6d4"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- 4. Bug Legs — 3 pairs, stepping in alternating tripod -->
    <!-- Front pair -->
    <path class="leg leg-fl" d="M 46 51 Q 33 46 34 38" stroke="#6366f1" stroke-width="3" stroke-linecap="round" fill="none" />
    <path class="leg leg-fr" d="M 74 51 Q 87 46 86 38" stroke="#6366f1" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Middle pair -->
    <path class="leg leg-ml" d="M 43 62 Q 30 62 31 52" stroke="#6366f1" stroke-width="3" stroke-linecap="round" fill="none" />
    <path class="leg leg-mr" d="M 77 62 Q 90 62 89 52" stroke="#6366f1" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Hind pair -->
    <path class="leg leg-hl" d="M 46 73 Q 33 78 34 88" stroke="#6366f1" stroke-width="3" stroke-linecap="round" fill="none" />
    <path class="leg leg-hr" d="M 74 73 Q 87 78 86 88" stroke="#6366f1" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- 5. Bug Carapace Body -->
    <ellipse
      cx="60"
      cy="63"
      rx="16.5"
      ry="19.5"
      fill="#0b1329"
      stroke="#06b6d4"
      stroke-width="3"
    />

    <!-- 6. Carapace Center Division Line -->
    <line
      x1="60"
      y1="45"
      x2="60"
      y2="82"
      stroke="#06b6d4"
      stroke-width="2.5"
      stroke-linecap="round"
    />

    <!-- 7. Minimalist Emerald QA Verification Indicator -->
    <circle cx="60" cy="63" r="3.5" fill="#10b981" class="pass-node" />
  </g>
</svg>
